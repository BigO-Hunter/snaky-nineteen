name = "package20"
defaultTargets = ["Submission"]

# SNAKY Bound-20 submission package (G3, 2026-11-02).
# Pinned per bigospeedrun/verifier profiles/lake-manifest.json @ 1f893c0a:
# toolchain leanprover/lean4:v4.34.1, Mathlib d13f23b723b8a846827a245b89c10fc7d3f11612.
# The verifier ignores submitted Lake files; these exist so the package builds
# locally against the exact pins.

[[require]]
name = "Mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# The only source root (maintainer contract): every module of the solution lives
# under Submission/ — the byte-for-byte verifier statement, the vendored gotrevor
# card world, the plane bridge (G1/G2), and the G3 bookkeeping lemmas.
# Submodules-only glob (house pattern of this tree's Comparator lib): a one-glob
# member with cross-lib imports trips Lake's lib-level import check.
[[lean_lib]]
name = "Submission"
globs = ["Submission", "Submission.+"]
